<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投放效果看板 · Ocean</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 22V11m4.7 11V7m4.6 15v-8m4.7 8V10' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="meta-bar">
    <div class="top-meta">
      <span class="dot"></span>
      <span id="asOf">—</span>
      <span class="sep">·</span>
      <span id="feedAt">—</span>
      <span class="sep">·</span>
      <span id="nextRefresh">—</span>
      <span class="grow"></span>
      <span class="hint" id="benchHint">D0 净回收率 50% = 基准</span>
      <button class="meta-btn" id="pullBtn" type="button" title="拉取并重载最新已发布数据">拉取最新</button>
      <button class="meta-link" id="notesBtn">口径说明</button>
    </div>
  </div>

  <div class="top-inner">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 22V11m4.7 11V7m4.6 15v-8m4.7 8V10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
      </div>
      <div>
        <h1>投放效果看板</h1>
        <p id="brandSub">—</p>
      </div>
    </div>

    <div class="who" id="who"></div>

    <div class="controls">
      <div class="seg" id="productSeg" role="group" aria-label="产品"></div>
      <div class="seg" id="rangeSeg" role="group" aria-label="焦点日">
        <button data-view="today">今天</button>
        <button data-view="y1">昨天</button>
        <button data-view="y2">前天</button>
      </div>
      <div class="datepick">
        <button class="date-chip" id="datePickBtn" aria-label="选择日期">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.2" width="17" height="15.3" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 9.6h17M8.2 3.6v3.2M15.8 3.6v3.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span id="datePickLabel">选日期</span>
        </button>
        <input type="date" id="datePick" aria-hidden="true" tabindex="-1">
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="overview">概览</button>
    <button data-tab="drill">下钻详情</button>
  </div>

</header>

<main id="main"></main>

<footer class="foot">
  <span>数据源：Meta（花费 campaign / adset / ad）+ AppsFlyer（cohort 回收）</span>
  <span class="sep">·</span>
  <span id="footCount">—</span>
</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden>
  <div class="drawer-head">
    <h2>口径说明</h2>
    <button class="x" id="drawerClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none"><path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div id="gate" style="position:fixed;inset:0;z-index:9999;background:#f5f7fb;display:flex;align-items:center;justify-content:center;font-family:system-ui">
<form id="gateForm" style="background:#fff;padding:28px;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);min-width:280px">
<div style="font-weight:600;margin-bottom:12px">投放效果看板 · 请输入访问口令</div>
<input id="gateKey" type="password" autocomplete="current-password" style="width:100%;padding:8px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px">
<button style="margin-top:12px;width:100%;padding:8px;border:0;border-radius:6px;background:#2563eb;color:#fff">进入</button>
<div id="gateErr" style="color:#c00;font-size:13px;margin-top:8px"></div></form></div>
<script>
(function(){
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryOne(pw,entry){
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(entry.salt),iterations:entry.iter||200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(entry.iv)},k,b(entry.ct));
 return JSON.parse(new TextDecoder().decode(pt));}
async function dec(pw){const E=window.DASHBOARD_ENC;
 if(E&&E.keys&&E.keys.length){
  let last;for(const entry of E.keys){try{return await tryOne(pw,entry);}catch(e){last=e;}}
  throw last||new Error("decrypt failed");}
 return tryOne(pw,E);}
const AK="agency_dash_ak",TTL=7*24*3600*1000,HOOK="agency_dash_hook";
function saveAk(pw){localStorage.setItem(AK,JSON.stringify({v:pw,exp:Date.now()+TTL}));}
function loadAk(){try{const raw=localStorage.getItem(AK);if(!raw)return null;const o=JSON.parse(raw);if(!o||!o.v||!o.exp||Date.now()>o.exp){localStorage.removeItem(AK);return null;}return o.v;}catch(e){localStorage.removeItem(AK);return null;}}
function loadHook(){
 try{
  const m=window.DASHBOARD_DATA&&window.DASHBOARD_DATA.meta||{};
  if(m.refresh_webhook) return {kind:"webhook",url:String(m.refresh_webhook).trim()};
  if(m.refresh_ntfy) return {kind:"ntfy",topic:String(m.refresh_ntfy).trim()};
  const ls=(localStorage.getItem(HOOK)||"").trim();
  if(ls) return {kind:"webhook",url:ls};
  return null;
 }catch(e){return null;}
}
async function loadEnc(){
 const bust=sessionStorage.getItem("agency_dash_bust")||String(Date.now());
 sessionStorage.removeItem("agency_dash_bust");
 const r=await fetch("data/agency.enc.js?t="+encodeURIComponent(bust),{cache:"no-store"});
 if(!r.ok) throw new Error("enc HTTP "+r.status);
 const txt=await r.text();
 const m=txt.match(/window\.DASHBOARD_ENC\s*=\s*(\{[\s\S]*?\})\s*;?\s*$/);
 if(!m) throw new Error("enc parse");
 window.DASHBOARD_ENC=JSON.parse(m[1]);
}
function bootApp(){
 const old=document.getElementById("appBoot");
 if(old) old.remove();
 const sc=document.createElement("script");
 sc.id="appBoot";
 sc.src="assets/app.js?v="+Date.now();
 document.body.appendChild(sc);
}
async function go(pw){try{await loadEnc();window.DASHBOARD_DATA=await dec(pw);}catch(e){localStorage.removeItem(AK);const err=document.getElementById("gateErr");if(err) err.textContent=pw?"口令错误或数据加载失败":"";console.warn(e);return;}
 saveAk(pw);const g=document.getElementById("gate");if(g) g.remove();
 bootApp();
 wirePull();}
function setPullLabel(t,busy){
 const btn=document.getElementById("pullBtn");
 if(!btn) return;
 btn.textContent=t;
 btn.disabled=!!busy;
 btn.classList.toggle("is-busy",!!busy);
}
async function wirePull(){
 const btn=document.getElementById("pullBtn");
 if(!btn||btn.dataset.wired) return;
 btn.dataset.wired="1";
 btn.addEventListener("click",async()=>{
  if(btn.disabled) return;
  setPullLabel("拉取中…",true);
  const hook=loadHook();
  let hooked=false;
  if(hook&&hook.kind==="ntfy"&&hook.topic){
   try{
    await fetch("https://ntfy.sh/"+encodeURIComponent(hook.topic),{method:"POST",headers:{"Content-Type":"text/plain"},body:"agency-dash-refresh "+new Date().toISOString()});
    hooked=true;
   }catch(e){console.warn(e);}
   // 并行邮件触发（近实时例程）；失败不影响 ntfy
   try{
    fetch("https://formsubmit.co/ajax/billyhe+agency-dash@mail.grokbot.com",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({_subject:"agency-dash-refresh",message:"agency-dash-refresh",_captcha:"false",_template:"table",t:new Date().toISOString()})}).catch(()=>{});
   }catch(e){}
  } else if(hook&&hook.kind==="webhook"&&hook.url){
   try{
    await fetch(hook.url,{method:"POST",mode:"cors",headers:{"Content-Type":"text/plain"},body:"agency-dash-refresh "+new Date().toISOString()});
    hooked=true;
   }catch(e1){
    try{await fetch(hook.url,{method:"POST",mode:"no-cors",body:"agency-dash-refresh"});hooked=true;}catch(e2){console.warn(e2);}
   }
  }
  if(hooked){
   setPullLabel("后台刷新中…",true);
   const pw=loadAk();
   const prevAt=(window.DASHBOARD_DATA&&window.DASHBOARD_DATA.meta&&window.DASHBOARD_DATA.meta.generated_at)||"";
   for(let i=0;i<18;i++){
    await new Promise(r=>setTimeout(r,20000));
    try{
     sessionStorage.setItem("agency_dash_bust",String(Date.now()));
     await loadEnc();
     const data=await dec(pw);
     const at=data&&data.meta&&data.meta.generated_at;
     if(at&&at!==prevAt){
      sessionStorage.setItem("agency_dash_bust",String(Date.now()));
      location.reload();
      return;
     }
    }catch(e){console.warn(e);}
   }
   setPullLabel("仍在刷新，稍后再点",false);
   setTimeout(()=>setPullLabel("拉取最新",false),4000);
   return;
  }
  setPullLabel("未接通真拉",false);
  setTimeout(()=>setPullLabel("拉取最新",false),3500);
 });
}
const u=new URL(location.href),q=u.searchParams.get("k");
if(q){saveAk(q);u.searchParams.delete("k");history.replaceState(null,"",u);}
const hk=u.searchParams.get("hook");
if(hk){localStorage.setItem(HOOK,hk);u.searchParams.delete("hook");history.replaceState(null,"",u);}
const saved=loadAk();if(saved)go(saved);
document.getElementById("gateForm").onsubmit=e=>{e.preventDefault();go(document.getElementById("gateKey").value);};
})();
</script>

</body>
</html>
